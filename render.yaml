services:
  # FastAPI Backend Service
  - type: web
    name: studyos-backend
    env: python
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studyos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://studyos-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://studyos-frontend.onrender.com"

  # React + Vite Frontend Service
  - type: web
    name: studyos-frontend
    env: static
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://studyos-backend.onrender.com"

databases:
  - name: studyos-db
    databaseName: studyos_db
    user: studyos_user
    region: oregon
